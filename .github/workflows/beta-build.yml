name: PIX beta candidate build

on:
  push:
    branches: [beta-build-0.1.5]
    paths:
      - .github/workflows/beta-build.yml
      - include/version.h
      - src/**
      - include/**
      - tests/**
      - tools/**
      - Makefile
      - packaging/**
      - licenses/**
      - docs/**

permissions:
  contents: read

concurrency:
  group: pix-beta-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache build-base linux-headers curl bzip2 pkgconf python3
            sh tests/test_mdev.sh
            CFLAGS="-O2 -g -Werror" tools/build-portable.sh musl
          '
      - run: python3 tools/audit-binary.py '${{ matrix.target }}' build/musl/pix-ts
      - run: python3 tools/package-release.py '${{ matrix.target }}' build/musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pix-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: CFLAGS='-O2 -g -Werror' tools/build-portable.sh native
      - run: python3 tools/audit-binary.py darwin-arm64 build/native/pix-ts
      - run: python3 tools/package-release.py darwin-arm64 build/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pix-darwin-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        id: ndk
        with:
          ndk-version: r27d
      - run: tools/build-portable.sh android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_ABI: ${{ matrix.abi }}
          CFLAGS: -O2 -g -Werror
      - run: python3 tools/audit-binary.py 'android-${{ matrix.abi }}' 'build/android-${{ matrix.abi }}/pix-ts'
      - run: python3 tools/package-release.py 'android-${{ matrix.abi }}' 'build/android-${{ matrix.abi }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pix-android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make curl p7zip python
      - shell: msys2 {0}
        run: tools/build-windows.sh
      - shell: msys2 {0}
        run: python tools/audit-binary.py windows-x64 build/windows-x64/pix-ts.exe
      - shell: bash
        run: python tools/package-release.py windows-x64 build/windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pix-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: tools/package-source.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pix-source
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  candidate:
    needs: [linux, macos, android, windows, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pix-*
          merge-multiple: true
          path: dist
      - run: |
          python3 tools/verify-release.py
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile

          root = Path('dist')
          version = '0.1.5'
          files = sorted(p for p in root.glob(f'pix-userland-{version}-*.tar.gz'))
          if len(files) != 8:
              raise SystemExit(f'expected seven platform archives and source, got {len(files)}')
          manifest = {
              'schema': 1,
              'candidate': '0.1.5-beta.1',
              'product': 'pix-userland',
              'internal_version': version,
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'platforms': [
                  p.name.removeprefix(f'pix-userland-{version}-').removesuffix('.tar.gz')
                  for p in files if not p.name.endswith('-source.tar.gz')
              ],
              'source_archive': f'pix-userland-{version}-source.tar.gz',
              'device_assets': {'DT181': False, 'DT295': False},
              'archives': [
                  {'filename': p.name, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in files
              ],
          }
          stage = Path('beta-candidate')
          stage.mkdir()
          for p in files:
              (stage / p.name).write_bytes(p.read_bytes())
          (stage / 'SHA256SUMS').write_text((root / 'SHA256SUMS').read_text(), encoding='ascii')
          (stage / 'pix-userland-0.1.5-beta.1-candidate.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with tarfile.open('pix-userland-0.1.5-beta.1-candidate.tar.gz', 'w:gz') as archive:
              for p in sorted(stage.iterdir()):
                  archive.add(p, arcname=p.name, recursive=False)
          PY
          mkdir -p beta-output
          cp pix-userland-0.1.5-beta.1-candidate.tar.gz beta-output/
          cp beta-candidate/pix-userland-0.1.5-beta.1-candidate.json beta-output/
          cp beta-candidate/SHA256SUMS beta-output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pix-userland-0.1.5-beta.1-candidate
          path: beta-output/*
          if-no-files-found: error
          retention-days: 90
