name: Release
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Build and verify packages without publishing
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
jobs:
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: tools/check-private.sh
      - id: version
        shell: bash
        run: |
          version=$(sed -n 's/^#define VERSION "\([0-9][0-9.]*\)"/\1/p' include/version.h)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=$(sh tools/release-publish-mode.sh '${{ inputs.candidate }}' "$GITHUB_REF")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            # Any matching existing tag or release must be handled explicitly.
            test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$version" --jq length)" = 0
            gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > /tmp/release-tags
            if grep -Fxq "v$version" /tmp/release-tags; then
              exit 1
            fi
          fi
  linux:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache build-base linux-headers curl bzip2 pkgconf cmake git python3 ca-certificates
            sh tests/test_mdev.sh
            PIX_EMBEDDED_ASSETS=ON CFLAGS="-O2 -g -Werror" tools/build-portable.sh musl
          '
      - run: python3 tools/verify-embedded-assets.py build/musl/pixd "$PWD/assets" "$PWD/assets/dt295.assets" build/musl/embedded-assets.json --build-info build/musl/build-info.txt
      - run: for program in pixd pixctl pix-ts; do python3 tools/audit-binary.py '${{ matrix.target }}' "build/musl/$program"; done
      - run: python3 tools/package-release.py '${{ matrix.target }}' build/musl
      - run: tools/check-private.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  macos:
    needs: preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: brew install cmake pkgconf
      - run: PIX_EMBEDDED_ASSETS=ON CFLAGS='-O2 -g -Werror' tools/build-portable.sh native
      - run: python3 tools/verify-embedded-assets.py build/native/pixd "$PWD/assets" "$PWD/assets/dt295.assets" build/native/embedded-assets.json --build-info build/native/build-info.txt
      - run: for program in pixd pixctl pix-ts; do python3 tools/audit-binary.py darwin-arm64 "build/native/$program"; done
      - run: python3 tools/package-release.py darwin-arm64 build/native
      - run: tools/check-private.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darwin-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  android:
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        id: ndk
        with:
          ndk-version: r27d
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - run: tools/build-portable.sh android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_ABI: ${{ matrix.abi }}
          CFLAGS: -O2 -g -Werror
          PIX_EMBEDDED_ASSETS: ON
      - run: python3 tools/verify-embedded-assets.py "build/android-${{ matrix.abi }}/pixd" "$PWD/assets" "$PWD/assets/dt295.assets" "build/android-${{ matrix.abi }}/embedded-assets.json" --build-info "build/android-${{ matrix.abi }}/build-info.txt"
      - run: for program in pixd pixctl pix-ts; do python3 tools/audit-binary.py 'android-${{ matrix.abi }}' "build/android-${{ matrix.abi }}/$program"; done
      - run: python3 tools/package-release.py 'android-${{ matrix.abi }}' 'build/android-${{ matrix.abi }}'
      - run: tools/check-private.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  windows:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config make curl xz-utils bzip2 binutils
      - run: PIX_EMBEDDED_ASSETS=ON tools/build-windows.sh
      - run: python3 tools/verify-embedded-assets.py build/windows-x64/pixd.exe "$PWD/assets" "$PWD/assets/dt295.assets" build/windows-x64/embedded-assets.json --build-info build/windows-x64/build-info.txt
      - run: for program in pixd pixctl pix-ts; do python3 tools/audit-binary.py windows-x64 "build/windows-x64/$program.exe"; done
      - shell: bash
        run: python3 tools/package-release.py windows-x64 build/windows-x64
      - shell: bash
        run: tools/check-private.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  windows-smoke:
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64
          path: windows-package
      - shell: pwsh
        run: |
          $archive = (Get-ChildItem windows-package/*.tar.gz).FullName
          tar -xzf $archive -C windows-package
          if ($LASTEXITCODE -ne 0) { throw "Windows package extraction failed" }
          $directory = (Get-ChildItem windows-package -Directory).FullName
          foreach ($name in @('pixd', 'pixctl', 'pix-ts')) {
            $program = Join-Path $directory "$name.exe"
            & $program --version
            if ($LASTEXITCODE -ne 0) { throw "$name version failed" }
            & $program --help
            if ($LASTEXITCODE -ne 0) { throw "$name help failed" }
          }
  source:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: tools/package-source.sh
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - run: tools/check-source-rebuild.sh dist/pix-userland-*-source.tar.gz "$RUNNER_TEMP/source-rebuild"
      - run: tools/check-private.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  verify:
    needs: [preflight, linux, macos, android, windows, windows-smoke, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Verify release set and checksums
        run: python3 tools/verify-release.py --with-embedded-assets
      - run: tools/check-private.sh
  release:
    if: needs.preflight.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tools/check-private.sh
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "pix-userland v$VERSION" --notes-file docs/releases.md
          for asset in dist/*; do
            tools/check-private.sh
            gh release upload "v$VERSION" "$asset"
          done
          tools/check-private.sh
          gh release edit "v$VERSION" --draft=false --latest
          gh release view "v$VERSION" --json isDraft,assets,url
